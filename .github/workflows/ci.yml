name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Markdown lint & link check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "README.md" "docs/*.md" "CONTRIBUTING.md"

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose "README.md" "CONTRIBUTING.md" "docs/*.md"
          fail: true
